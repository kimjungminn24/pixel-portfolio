name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check.js
      - id: pages
        uses: actions/configure-pages@v6
      # project sites live under /repo-name/, user sites keep /
      - run: |
          base="${{ steps.pages.outputs.base_path }}/"
          sed -i "s#<base href=\"/\">#<base href=\"${base}\">#" index.html 404.html
          grep -o '<base href="[^"]*">' index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
